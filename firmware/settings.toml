# CircuitPython runtime settings (read by the interpreter at boot).
#
# CIRCUITPY_PYSTACK_SIZE: the fixed Python call-stack budget. The default
# (1536 bytes) is too small for the Vision 6 UI's deepest real path —
# key press -> menu macro -> inject -> layer switch -> grid paint ->
# adafruit_display_text Label internals — which intermittently died with
# RuntimeError('pystack exhausted') and left the screen on the old layer.
# 4096 gives comfortable headroom; the ~2.5KB extra is carved from the
# same RAM the heap uses, a worthwhile trade on a board whose worst
# failure mode was a swallowed repaint.
CIRCUITPY_PYSTACK_SIZE = 4096
