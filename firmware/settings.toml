# CircuitPython runtime settings (read by the interpreter at boot).
#
# CIRCUITPY_PYSTACK_SIZE: the fixed Python call-stack budget. The default
# (1536 bytes) intermittently died with RuntimeError('pystack exhausted')
# on the Vision 6 UI's deepest real path (key press -> menu macro ->
# inject -> layer switch -> grid paint -> Label internals). 2048 covers
# that depth; 4096 was tried and starved the heap into a boot loop.
CIRCUITPY_PYSTACK_SIZE = 2048
