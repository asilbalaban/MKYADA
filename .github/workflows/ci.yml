name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax-check firmware
        run: python3 -m py_compile firmware/boot.py firmware/code.py firmware/mkyada/*.py
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The icon family has three generated consumers (simulator, firmware,
      # app). icons/src/icons.txt is the only editable copy, so an edit that
      # never ran the generator would leave the device drawing one picture and
      # the app offering another.
      - name: Icons match their source
        run: node scripts/build-icons.mjs --check
      # The device's UI strings are the firmware's; the web side's copy is
      # generated. The screens are laid out around how wide these are, so a
      # string edited on one side only is a layout bug waiting to happen.
      - name: UI strings match the firmware
        run: node scripts/build-oled-i18n.mjs --check
      - name: Firmware simulation tests
        run: python3 tests/firmware_sim_test.py
      # Renders every OLED screen into a real 128x64 buffer, checks the
      # structural invariants, and diffs the pictures against
      # tests/golden/*.txt. Regenerate deliberately with --bless.
      - name: OLED render + golden-image tests
        run: python3 tests/oled_render_test.py

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libudev-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libxi-dev libxtst-dev \
            libasound2-dev
          # libasound2-dev: rodio's cpal backend needs ALSA headers on Linux
          # (sound-effect playback). Until the frontend step started passing,
          # `cargo check` never ran here, so this gap was invisible.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Frontend build (type-check included)
        working-directory: app
        run: |
          npm ci
          npm run build
      # docs/simulator.html carries a pre-bundled copy of the app's own drawing
      # modules so it works as a static file. Committed for that reason, which
      # means it can go stale — this proves it hasn't.
      - name: Demo page bundle matches the app's modules
        run: |
          node scripts/build-demo.mjs
          git diff --exit-code -- docs/simulator.html
      # firmware/fonts/*.fnt is committed because it ships in the bundle, so the
      # thing that can go wrong is an edited .txt with a stale .fnt beside it —
      # the device would keep drawing the old glyphs and nothing would say so.
      # Recompile and require the result to be byte-identical.
      - name: Font compiles and matches its source
        run: |
          node scripts/build-font.mjs
          git diff --exit-code -- firmware/fonts/ app/src/lib/oled-font.ts

      # The published OLED pictures are firmware renders, not artwork: an
      # oled.py change must reach docs/images/oled or the site starts showing a
      # keypad that no longer exists.
      - name: Published OLED renders match the firmware
        run: |
          python3 scripts/render-oled.py
          git diff --exit-code -- app/screenshots/oled-frames.js

      # The same script every release build runs — catch a broken firmware
      # bundle here, not on the tag. --require-mpy also proves the pinned
      # mpy-cross/neopixel downloads still resolve.
      - name: Firmware dist builds (vendored libs + .mpy)
        run: node scripts/build-firmware-dist.mjs --require-mpy
      - name: No dev/screenshot scaffolding in dist
        working-directory: app
        run: |
          if grep -riq "mock-tauri" dist/index.html; then
            echo "dist/index.html references mock-tauri — dev scaffolding leaked into the build"
            exit 1
          fi
      - name: Recorder model tests
        run: npx -y tsx tests/model_test.ts
      - name: Unit tests (round-trip, layout, contract fixtures)
        working-directory: app
        run: npx vitest run
      - name: Rust check
        working-directory: app/src-tauri
        run: cargo check --locked
      - name: Rust lint
        working-directory: app/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
