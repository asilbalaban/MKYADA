name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax-check firmware
        run: python3 -m py_compile firmware/boot.py firmware/code.py firmware/mkyada/*.py
      - name: Firmware simulation tests
        run: python3 tests/firmware_sim_test.py
      # Renders all 19 OLED screens into a real 128x64 buffer and diffs them
      # against tests/golden/*.txt. Regenerate deliberately with --bless.
      - name: OLED render + golden-image tests
        run: python3 tests/oled_render_test.py

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libudev-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libxi-dev libxtst-dev \
            libasound2-dev
          # libasound2-dev: rodio's cpal backend needs ALSA headers on Linux
          # (sound-effect playback). Until the frontend step started passing,
          # `cargo check` never ran here, so this gap was invisible.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Frontend build (type-check included)
        working-directory: app
        run: |
          npm ci
          npm run build
      # firmware/fonts/*.fnt is committed because it ships in the bundle, so the
      # thing that can go wrong is an edited .txt with a stale .fnt beside it —
      # the device would keep drawing the old glyphs and nothing would say so.
      # Recompile and require the result to be byte-identical.
      - name: Font compiles and matches its source
        run: |
          node scripts/build-font.mjs
          node scripts/build-font.mjs --html --public
          git diff --exit-code -- firmware/fonts/ docs/font.html

      # The same script every release build runs — catch a broken firmware
      # bundle here, not on the tag. --require-mpy also proves the pinned
      # mpy-cross/neopixel downloads still resolve.
      - name: Firmware dist builds (vendored libs + .mpy)
        run: node scripts/build-firmware-dist.mjs --require-mpy
      - name: No dev/screenshot scaffolding in dist
        working-directory: app
        run: |
          if grep -riq "mock-tauri" dist/index.html; then
            echo "dist/index.html references mock-tauri — dev scaffolding leaked into the build"
            exit 1
          fi
      - name: Recorder model tests
        run: npx -y tsx tests/model_test.ts
      - name: Unit tests (round-trip, layout, contract fixtures)
        working-directory: app
        run: npx vitest run
      - name: Rust check
        working-directory: app/src-tauri
        run: cargo check --locked
      - name: Rust lint
        working-directory: app/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
