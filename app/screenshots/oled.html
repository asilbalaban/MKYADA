<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>MKYADA Vision 6 — OLED screens</title>
    <style>
      /* The Vision 6's screens, rendered by the firmware itself (see
         scripts/render-oled.py) and blown up here with
         image-rendering:pixelated inside a device bezel so they read like the
         real low-res SH1106. These are not mockups: every lit pixel is a pixel
         the device lights. */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #0d0f14;
        padding: 44px;
        display: flex;
        flex-wrap: wrap;
        gap: 44px;
        align-items: flex-start;
      }
      figure { display: flex; flex-direction: column; align-items: center; }
      .dev {
        background: linear-gradient(#20242c, #171a20);
        padding: 16px;
        border-radius: 18px;
        box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 10px 30px rgba(0,0,0,.5);
        border: 1px solid #2c313b;
      }
      canvas {
        display: block;
        width: 640px;  /* 128 × 5 */
        height: 320px; /* 64 × 5 */
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        border-radius: 6px;
        box-shadow: 0 0 22px rgba(150,200,255,.10);
        background: #000;
      }
      figcaption {
        margin-top: 14px;
        color: #9aa4b6;
        font-family: system-ui, sans-serif;
        font-size: 15px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <script type="module">
      // The screens are REAL firmware renders: scripts/render-oled.py runs
      // firmware/mkyada/oled.py against the shipped font and writes the bitmaps
      // into oled-frames.js. This file only enlarges them behind a bezel.
      // Nothing here knows what a title bar is, so nothing here can disagree
      // with the device — which the hand-drawn Courier mockup this replaced
      // eventually did.
      import { FRAMES } from "./oled-frames.js";

      const W = 128, H = 64;
      const INK = [234, 243, 255, 255];   // lit SH1106 pixel

      for (const f of FRAMES) {
        const fig = document.createElement("figure");
        const dev = document.createElement("div");
        dev.className = "dev";
        dev.id = "oled-" + f.id;
        const canvas = document.createElement("canvas");
        canvas.width = W;
        canvas.height = H;
        dev.appendChild(canvas);
        const cap = document.createElement("figcaption");
        cap.textContent = f.caption;
        fig.append(dev, cap);
        document.body.appendChild(fig);

        const ctx = canvas.getContext("2d");
        ctx.imageSmoothingEnabled = false;
        const img = ctx.createImageData(W, H);
        f.rows.forEach((hex, y) => {
          // 32 hex characters per row, MSB = leftmost pixel. Read a nibble at a
          // time: 128 bits does not fit in a JS number.
          for (let n = 0; n < 32; n++) {
            const v = parseInt(hex[n], 16);
            for (let b = 0; b < 4; b++) {
              if (!(v & (1 << (3 - b)))) continue;
              const o = ((y * W) + n * 4 + b) * 4;
              img.data.set(INK, o);
            }
          }
        });
        // Unlit pixels stay transparent in the ImageData, so lay the black
        // glass down first and draw the lit ones over it.
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, W, H);
        createImageBitmap(img).then((bmp) => ctx.drawImage(bmp, 0, 0));
      }
    </script>
  </body>
</html>
