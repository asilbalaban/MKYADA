<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>MKYADA Vision 6 — OLED mockups</title>
    <style>
      /* Faithful re-creation of the Vision 6 firmware's OLED screens. The
         geometry mirrors firmware/mkyada/oled.py 1:1 — the 3×2 macro grid with
         vertical dividers, the top/bottom bars, the home layer-carousel, the
         centered settings list, the label:value About rows. Drawn at true
         128×64 on a canvas, then upscaled with image-rendering:pixelated inside
         a device bezel so it reads like the real low-res SH1106. */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #0d0f14;
        padding: 44px;
        display: flex;
        flex-wrap: wrap;
        gap: 44px;
        align-items: flex-start;
      }
      figure { display: flex; flex-direction: column; align-items: center; }
      .dev {
        background: linear-gradient(#20242c, #171a20);
        padding: 16px;
        border-radius: 18px;
        box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 10px 30px rgba(0,0,0,.5);
        border: 1px solid #2c313b;
      }
      canvas {
        display: block;
        width: 640px;  /* 128 × 5 */
        height: 320px; /* 64 × 5 */
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        border-radius: 6px;
        box-shadow: 0 0 22px rgba(150,200,255,.10);
        background: #000;
      }
      figcaption {
        margin-top: 14px;
        color: #9aa4b6;
        font-family: system-ui, sans-serif;
        font-size: 15px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <figure><div class="dev" id="oled-home"><canvas width="128" height="64"></canvas></div><figcaption>Home — the layer carousel</figcaption></figure>
    <figure><div class="dev" id="oled-grid"><canvas width="128" height="64"></canvas></div><figcaption>Grid — the active layer's six macros</figcaption></figure>
    <figure><div class="dev" id="oled-speed"><canvas width="128" height="64"></canvas></div><figcaption>Speed editor — 0.1×–10.0× per macro</figcaption></figure>
    <figure><div class="dev" id="oled-settings"><canvas width="128" height="64"></canvas></div><figcaption>Settings menu</figcaption></figure>
    <figure><div class="dev" id="oled-about"><canvas width="128" height="64"></canvas></div><figcaption>About — model, firmware, device id</figcaption></figure>
    <figure><div class="dev" id="oled-wheel-scene"><canvas width="128" height="64"></canvas></div><figcaption>Wheel menu — OBS scene picker</figcaption></figure>
    <figure><div class="dev" id="oled-wheel-status"><canvas width="128" height="64"></canvas></div><figcaption>Wheel menu — OBS record status</figcaption></figure>
    <figure><div class="dev" id="oled-wheel-volume"><canvas width="128" height="64"></canvas></div><figcaption>Wheel menu — system volume</figcaption></figure>

    <script>
      const W = 128, H = 64, CX = 64;
      const INK = "#eaf3ff";                 // OLED lit pixel
      const F = "'Courier New', monospace";
      const font = (px, bold) => (bold ? "bold " : "") + px + "px " + F;

      function ctxFor(id) {
        const c = document.querySelector("#" + id + " canvas").getContext("2d");
        c.imageSmoothingEnabled = false;
        c.textBaseline = "middle";
        c.fillStyle = "#000"; c.fillRect(0, 0, W, H);
        c.fillStyle = INK;
        return c;
      }
      const rect = (c, x, y, w, h) => c.fillRect(x, y, Math.max(1, w), Math.max(1, h));
      function t(c, s, x, y, opt = {}) {
        c.font = opt.font || font(8);
        c.textAlign = opt.align || "center";
        c.fillStyle = opt.color || INK;
        c.fillText(s, x, y);
      }
      // inverted 13px title strip, centered black title (oled.py _top_bar)
      function topBar(c, title) {
        c.fillStyle = INK; rect(c, 0, 0, W, 13);
        t(c, title, CX, 6, { color: "#000", font: font(7) });
      }
      // 1px divider + "Back" left, optional centred hold hint, action right
      // (oled.py _bottom_bar)
      function bottomBar(c, action, hold) {
        c.fillStyle = INK; rect(c, 0, H - 13, W, 1);
        t(c, "Back", 2, H - 6, { align: "left", font: font(8) });
        if (hold) t(c, hold, W / 2, H - 6, { align: "center", font: font(8) });
        if (action) t(c, action, W - 2, H - 6, { align: "right", font: font(8) });
      }

      // HOME: big current layer letter + a dot carousel (layers + SETTINGS)
      function drawHome(c) {
        t(c, "A", CX, 24, { font: font(38, true) });
        const layerCount = 3, n = layerCount + 1, pos = 0, gap = 14;
        const x0 = CX - ((n - 1) * gap) / 2;
        for (let i = 0; i < n; i++) {
          const r = i === pos ? 3 : 1;
          c.fillStyle = INK;
          c.beginPath(); c.arc(x0 + i * gap, 54, r, 0, 7); c.fill();
        }
      }

      // GRID: 3×2 cells, vertical dividers, macro names centered (2-line wrap),
      // active cell inverted, optional inverted layer/profile band on top.
      function drawGrid(c) {
        const band = "(A) Stream", BAND_H = 10, top = BAND_H;
        c.fillStyle = INK; rect(c, 0, 0, W, BAND_H);
        t(c, band, CX, 4, { color: "#000", font: font(8) });
        const cw = 42, ch = ((H - top) / 2) | 0; // 42 × 27
        c.fillStyle = INK;
        rect(c, cw, top, 1, H - top); rect(c, 2 * cw, top, 1, H - top);
        rect(c, 0, top + ch, W, 1);
        // names, split to two lines exactly like the firmware does
        const cells = [
          ["Go Live"], ["Record"], ["Push-to-", "talk"],
          ["Discord"], ["Mute"], ["Now", "live!"],
        ];
        const active = 0, y1 = 9, y2 = 18;
        cells.forEach((lines, k) => {
          const x = (k % 3) * cw, y = top + ((k / 3) | 0) * ch;
          let col = INK;
          if (k === active) { c.fillStyle = INK; rect(c, x, y, cw, ch); col = "#000"; }
          const cx = x + cw / 2;
          if (lines.length === 2) {
            t(c, lines[0], cx, y + y1, { color: col });
            t(c, lines[1], cx, y + y2, { color: col });
          } else {
            t(c, lines[0], cx, y + ch / 2, { color: col });
          }
        });
      }

      // SPEED: top bar, big value, slider, Back/Save (oled.py show_speed)
      function drawSpeed(c) {
        topBar(c, "A > K1  Speed");
        t(c, "1.4", CX, 28, { font: font(17, true) });
        const bx = 8, by = 39, bw = W - 16, frac = 13 / 99;
        c.fillStyle = INK;
        rect(c, bx, by + 2, bw, 1);              // track
        rect(c, bx, by, Math.round(frac * bw), 4); // fill
        bottomBar(c, "Save");
      }

      // SETTINGS: top bar + 3 visible centered rows, selected inverted, a
      // down-arrow (more below), Back/Select (oled.py show_menu, MENU_VIS=3)
      function drawSettings(c) {
        topBar(c, "Settings");
        const items = ["Font", "Auto-return", "Language"], sel = 0;
        items.forEach((s, row) => {
          const y = 20 + row * 12;
          let col = INK;
          if (row === sel) { c.fillStyle = INK; rect(c, 0, y - 6, W - 8, 12); col = "#000"; }
          t(c, s, CX, y, { color: col, font: font(8) });
        });
        // "more below" down-arrow on the right rail
        c.fillStyle = INK;
        c.beginPath();
        c.moveTo(W - 7, 45); c.lineTo(W - 1, 45); c.lineTo(W - 4, 49); c.fill();
        bottomBar(c, "Select");
      }

      // ABOUT: top bar + label:value rows + Back (oled.py show_about)
      function drawAbout(c) {
        topBar(c, "About");
        const rows = [
          ["Model", "vision6"], ["Firmware", "0.17.9"], ["Device id", "E6605481DB11"],
        ];
        let y = 22;
        rows.forEach(([l, v]) => {
          t(c, l + ":", 4, y, { align: "left", font: font(8) });
          t(c, v, W - 4, y, { align: "right", font: font(8) });
          y += 12;
        });
        bottomBar(c, null);
      }

      // WHEEL MENU — OBS scene picker (a host-fed list; picking reassigns the key)
      function drawWheelScene(c) {
        topBar(c, "SCENE");
        const rows = [["Intro", 1], ["Game", 0], ["Break", 0]], sel = 1;
        rows.forEach(([label, live], row) => {
          const y = 20 + row * 12;
          let col = INK;
          if (row === sel) { c.fillStyle = INK; rect(c, 0, y - 6, W - 8, 12); col = "#000"; }
          t(c, (row === sel ? "▸ " : "  ") + label, 6, y, { align: "left", color: col });
          if (live) { c.fillStyle = INK; c.beginPath(); c.arc(W - 12, y, 2, 0, 7); c.fill(); }
        });
        bottomBar(c, "Pick", "hold: assign");
      }
      // WHEEL MENU — OBS record status card (press toggles; live REC dot)
      function drawWheelStatus(c) {
        topBar(c, "RECORD");
        t(c, "REC ●", CX, 30, { font: font(15, true) });
        bottomBar(c, "toggle");
      }
      // WHEEL MENU — system volume slider (turn to set %, applied live)
      function drawWheelVolume(c) {
        topBar(c, "VOLUME");
        t(c, "40%", CX, 28, { font: font(17, true) });
        const bx = 8, by = 39, bw = W - 16, frac = 0.4;
        c.fillStyle = INK;
        rect(c, bx, by + 2, bw, 1);
        rect(c, bx, by, Math.round(frac * bw), 4);
        bottomBar(c, "OK");
      }

      drawHome(ctxFor("oled-home"));
      drawGrid(ctxFor("oled-grid"));
      drawSpeed(ctxFor("oled-speed"));
      drawSettings(ctxFor("oled-settings"));
      drawAbout(ctxFor("oled-about"));
      drawWheelScene(ctxFor("oled-wheel-scene"));
      drawWheelStatus(ctxFor("oled-wheel-status"));
      drawWheelVolume(ctxFor("oled-wheel-volume"));
    </script>
  </body>
</html>
